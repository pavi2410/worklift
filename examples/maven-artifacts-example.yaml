name: maven-app

artifacts:
  compileClasspath: {}
  testClasspath: {}

dependencies:
  compile-src: [prepare]
  compile-test: [compile-src]
  test: [compile-src, compile-test]
  run: [compile-src]
  build: [compile-src, compile-test]

clean: [prepare, compile-src, compile-test]

targets:
  prepare:
    - mkdir:
        paths:
          - build/classes
          - build/test-classes

  resolve-deps-for-compile:
    - maven-dep:
        coordinates:
          - org.json:json:20230227
          - com.google.guava:guava:31.1-jre
        into: $compileClasspath

  resolve-deps-for-test:
    - maven-dep:
        coordinates:
          - commons-lang:commons-lang:2.6
          - junit:junit:4.13.2
        into: $testClasspath

  compile-src:
    - javac:
        sources: src/**/*.java
        destination: build/classes
        classpath:
          - $compileClasspath

  compile-test:
    - javac:
        sources: test/**/*.java
        destination: build/test-classes
        classpath:
          - $compileClasspath
          - $testClasspath
          - build/classes

  test:
    - java:
        mainClass: com.example.TestRunner
        classpath:
          - $compileClasspath
          - $testClasspath
          - build/classes
          - build/test-classes
        args:
          - --verbose

  run:
    - java:
        mainClass: com.example.Main
        classpath:
          - $compileClasspath
          - build/classes
