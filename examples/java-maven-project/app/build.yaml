artifacts:
  appDependencies: {}

dependencies:
  compile-tests: [compile, string-utils:resolve-deps]
  test: [compile-tests]
  jar: [compile]
  build: [jar, test]
  run: [compile]

clean: [compile, compile-tests, test, jar]

targets:
  resolve-deps:
    - maven-dep:
        coordinates:
          - org.json:json:20230227
        into: $appDependencies

  compile:
    - javac:
        sources: src/main/java/com/example/app/Application.java
        destination: build/classes
        classpath:
          - $appDependencies
          - string-utils:jar
        sourceVersion: "11"
        targetVersion: "11"

  compile-tests:
    - javac:
        sources: src/test/java/com/example/app/ApplicationTest.java
        destination: build/test-classes
        classpath:
          - $junitClasspath
          - $appDependencies
          - string-utils:jar
          - compile
        sourceVersion: "11"
        targetVersion: "11"

  test:
    - junit:
        testClasses: build/test-classes
        classpath:
          - $junitClasspath
          - $appDependencies
          - string-utils:jar
          - compile
        reports: build/reports
        version: 5

  jar:
    - jar:
        from: build/classes
        to: build/libs/app.jar
        mainClass: com.example.app.Application

  run:
    - java:
        mainClass: com.example.app.Application
        classpath:
          - $appDependencies
          - string-utils:jar
          - compile
