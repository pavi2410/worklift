jvm:
  layout: maven
  source: "11"
  target: "11"

libraries:
  junitClasspath: junit5

variants:
  main: {}
  test:
    deps: [main, $junitClasspath]

dependencies:
  compile-tests: [compile]
  test: [compile-tests]
  jar: [compile]
  build: [jar, test]

clean: [compile, compile-tests, test, jar]

targets:
  compile:
    - javac: main

  compile-tests:
    - javac: test

  test:
    - junit:
        testClasses: test
        reports: build/reports
        version: 5

  jar:
    - jar:
        from: build/classes
        to: build/libs/string-utils.jar
